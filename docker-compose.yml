services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: threat
      POSTGRES_DB: threats
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat -d threats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: